<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fledge Mini Store</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#7f13ec",
            secondary: "#f97316",
            "background-dark": "#0a0a0a",
            "surface-dark": "#141118"
          },
          fontFamily: { display: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body class="bg-background-dark text-white font-display min-h-screen relative">
  <div id="toast-container" role="status" aria-live="polite" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px]"></div>
    <div class="absolute bottom-[10%] right-[-5%] w-[30%] h-[30%] rounded-full bg-secondary/10 blur-[100px]"></div>
  </div>

  <div class="relative z-10 max-w-6xl mx-auto px-6 pb-16">
    <header class="py-6 flex flex-col gap-4">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="size-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-[0_0_18px_rgba(127,19,236,0.35)]">
            <span class="material-symbols-outlined">storefront</span>
          </div>
          <div>
            <p class="text-xs uppercase tracking-[0.24em] text-slate-400">Fledge Global Storefront</p>
            <h1 id="store-name" class="text-2xl font-black tracking-tight">Mini Store</h1>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="px-3 py-1 rounded-full bg-white/10 border border-white/10 text-xs font-semibold">Sessionless</span>
          <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-semibold">Identity-first</span>
        </div>
      </div>
      <p id="store-desc" class="text-slate-400 max-w-2xl">Use ?code=&lt;emoji&gt; or ?storeId= to view a mini store.</p>
      <div class="flex flex-wrap items-center gap-3">
        <button id="btn-refresh" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gradient-to-r from-primary to-secondary text-sm font-bold shadow-[0_10px_30px_rgba(127,19,236,0.35)] hover:brightness-110 transition">
          <span class="material-symbols-outlined text-base">refresh</span>
          Refresh products
        </button>
        <a href="checkout.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 text-sm font-semibold transition">
          <span class="material-symbols-outlined text-base">shopping_cart</span>
          Go to Checkout
          <span id="cart-count" class="px-2 py-0.5 rounded-full bg-primary/20 text-primary text-xs font-bold">0</span>
        </a>
        <span class="px-3 py-1 rounded-full bg-white/10 border border-white/10 text-xs">Referral: <strong id="store-ref">-</strong></span>
        <span class="px-3 py-1 rounded-full bg-white/10 border border-white/10 text-xs">Visibility: <strong id="store-vis">-</strong></span>
      </div>
    </header>

    <main class="space-y-6">
      <section class="bg-surface-dark/80 border border-white/10 rounded-2xl p-6 shadow-xl shadow-black/20 backdrop-blur">
        <div class="flex items-center justify-between mb-4">
          <div>
            <p class="text-xs uppercase tracking-wide text-slate-400">Store</p>
            <h2 class="text-xl font-bold">Products</h2>
          </div>
        </div>
        <div id="store-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>

      <section class="bg-surface-dark/80 border border-white/10 rounded-2xl p-6 shadow-xl shadow-black/20 backdrop-blur">
        <div class="flex items-center justify-between mb-4">
          <div>
            <p class="text-xs uppercase tracking-wide text-slate-400">Global</p>
            <h2 class="text-xl font-bold">All public</h2>
          </div>
        </div>
        <div id="global-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>

      <section class="bg-surface-dark/80 border border-white/10 rounded-2xl p-6 shadow-xl shadow-black/20 backdrop-blur">
        <div class="flex items-center justify-between mb-3">
          <div>
            <p class="text-xs uppercase tracking-wide text-slate-400">Log</p>
            <h2 class="text-xl font-bold">Requests</h2>
          </div>
        </div>
        <pre id="log" class="bg-black/40 border border-white/5 rounded-xl p-4 text-xs text-slate-300 overflow-auto max-h-64">Ready...</pre>
      </section>
    </main>
  </div>

  <script type="module">
    const HOST = "https://base.thefledge.com";
    const ENDPOINTS = {
      bdo: `${HOST}/3003`,
      sanora: `${HOST}/7243`
    };

    const log = (msg) => {
      const el = document.getElementById("log");
      const t = new Date().toLocaleTimeString();
      if (el) el.textContent = `[${t}] ${msg}\n` + el.textContent;
      console.log(msg);
    };

    const toast = (message, type = "info") => {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const t = document.createElement("div");
      t.className = "pointer-events-auto px-4 py-3 rounded-lg text-sm font-semibold shadow-lg border text-white";
      t.style.background =
        type === "error" ? "rgba(239,68,68,0.95)" : type === "success" ? "rgba(34,197,94,0.95)" : "rgba(15,23,42,0.95)";
      t.textContent = message;
      container.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        t.style.transform = "translateY(-6px)";
        setTimeout(() => t.remove(), 200);
      }, 2600);
    };

    const loadCart = () => {
      try {
        const raw = localStorage.getItem("fledge-cart");
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    };

    const saveCart = (items) => {
      localStorage.setItem("fledge-cart", JSON.stringify(items));
      const badge = document.getElementById("cart-count");
      if (badge) badge.textContent = items.length.toString();
    };

    const fetchJSON = async (url) => {
      const res = await fetch(url);
      const txt = await res.text();
      let body = {};
      try { body = txt ? JSON.parse(txt) : {}; } catch { body = { raw: txt }; }
      if (!res.ok) throw new Error(body?.error || body?.message || res.statusText);
      log(`HTTP ${res.status} ${url}`);
      return body;
    };

    const renderEmpty = (container, message) => {
      if (!container) return;
      container.innerHTML = "";
      const d = document.createElement("div");
      d.className = "col-span-full text-slate-500 text-sm";
      d.textContent = message;
      container.appendChild(d);
    };

    const normalizeProducts = (data) => {
      const arr = Array.isArray(data)
        ? data
        : Array.isArray(data?.value)
        ? data.value
        : Array.isArray(data?.products)
        ? data.products
        : Array.isArray(data?.data)
        ? data.data
        : Array.isArray(data?.items)
        ? data.items
        : [];
      const flattened = [];
      arr.forEach((item) => {
        if (!item) return;
        if (Array.isArray(item)) {
          flattened.push(...item);
          return;
        }
        if (typeof item === "object") {
          const keys = Object.keys(item || {});
          if (keys.length && !item.title && !item.description) {
            keys.forEach((key) => {
              const val = item[key];
              if (val && typeof val === "object") {
                flattened.push({ ...val, productId: val.productId || val.id || key, title: val.title || key });
              }
            });
            return;
          }
        }
        flattened.push(item);
      });
      return flattened.map((p) => {
        const vis = p.visibility || (p.isPublic ? "global" : "store") || "global";
        return {
          ...p,
          title: p.title || p.name || "",
          visibility: vis,
          isPublic: vis === "global",
          storeId: p.storeId || ""
        };
      });
    };

    const renderProducts = (container, products, opts = {}) => {
      if (!container) return;
      container.innerHTML = "";
      if (!products || products.length === 0) {
        renderEmpty(container, "No products.");
        return;
      }
      products.forEach((p) => {
        const card = document.createElement("div");
        card.className =
          "rounded-2xl border border-white/10 bg-white/5 backdrop-blur-sm shadow-[0_18px_45px_rgba(0,0,0,0.35)] overflow-hidden flex flex-col hover:-translate-y-1 transition duration-300";

        if (p.photoUrl) {
          const imgWrap = document.createElement("div");
          imgWrap.className = "aspect-[4/3] w-full overflow-hidden";
          const img = document.createElement("img");
          img.src = p.photoUrl;
          img.alt = p.title || "product";
          img.className = "w-full h-full object-cover transition duration-500 hover:scale-105";
          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }

        const body = document.createElement("div");
        body.className = "p-4 flex flex-col gap-2 flex-1";

        const title = document.createElement("div");
        title.className = "text-lg font-semibold text-white";
        title.textContent = p.title || "(untitled)";
        body.appendChild(title);

        const desc = document.createElement("div");
        desc.className = "text-sm text-slate-400 line-clamp-3";
        desc.textContent = p.description || "";
        body.appendChild(desc);

        const meta = document.createElement("div");
        meta.className = "flex flex-wrap items-center gap-2 pt-1 mt-auto";
        const price = document.createElement("span");
        price.className = "px-2 py-1 rounded-full bg-primary/15 text-primary text-xs font-semibold border border-primary/25";
        price.textContent = `${p.price || 0} USD`;
        meta.appendChild(price);
        const vis = document.createElement("span");
        vis.className =
          "px-2 py-1 rounded-full text-xs font-semibold border " +
          (p.visibility === "private"
            ? "bg-slate-700/50 text-slate-200 border-slate-600/70"
            : p.isPublic
            ? "bg-green-500/10 text-green-300 border-green-500/30"
            : "bg-orange-500/10 text-orange-300 border-orange-500/30");
        vis.textContent = p.visibility === "private" ? "Private" : p.isPublic ? "Global" : "Store only";
        meta.appendChild(vis);
        if (opts.showStoreMeta && (p.storeId || opts.storeRef)) {
          const store = document.createElement("span");
          store.className = "px-2 py-1 rounded-full bg-white/10 text-xs text-slate-100 border border-white/15";
          store.textContent = `Store: ${p.storeId || opts.storeRef}`;
          meta.appendChild(store);
        }
        body.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "flex items-center justify-between pt-3";
        const storeTag = document.createElement("span");
        storeTag.className = "text-xs text-slate-500";
        storeTag.textContent = p.storeId ? `Store: ${p.storeId}` : "";
        actions.appendChild(storeTag);
        const addBtn = document.createElement("button");
        addBtn.className = "px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold border border-white/15";
        addBtn.textContent = "Add to cart";
        addBtn.addEventListener("click", () => {
          const cart = loadCart();
          cart.push({
            title: p.title,
            price: parseFloat(p.price || 0) || 0,
            description: p.description || "",
            photoUrl: p.photoUrl || "",
            storeId: p.storeId || opts.storeRef || ""
          });
          saveCart(cart);
          toast(`Added ${p.title || "item"} to cart`, "success");
        });
        actions.appendChild(addBtn);
        body.appendChild(actions);

        card.appendChild(body);
        container.appendChild(card);
      });
    };

    let currentStoreId = null;

    const loadStoreMeta = async () => {
      try {
        const params = new URLSearchParams(window.location.search);
        const emojicode = params.get("code");
        const storeIdParam = params.get("storeId");
        let store = null;
        let storeId = storeIdParam || null;

        if (emojicode) {
          const data = await fetchJSON(`${ENDPOINTS.bdo}/emoji/${encodeURIComponent(emojicode)}`);
          store = data.bdo?.store || {};
          storeId = store?.referralCode || storeIdParam || data.pubKey || emojicode;
          log(`Loaded store via emojicode ${emojicode}`);
        }

        if (!store && storeIdParam) {
          try {
            const short = await fetchJSON(`${ENDPOINTS.bdo}/short/${encodeURIComponent(storeIdParam)}`);
            const bdoData = short.bdo || {};
            store = bdoData.store || {};
            storeId = store?.referralCode || storeIdParam || short.pubKey;
            log(`Loaded store via shortcode ${storeIdParam}`);
          } catch (err) {
            log(`Shortcode lookup failed: ${err.message}`);
          }
        }

        if (store) {
          document.getElementById("store-name").textContent = store.name || "Fledge Store";
          document.getElementById("store-desc").textContent = store.description || "";
          document.getElementById("store-ref").textContent = store.referralLink || store.referralCode || emojicode || "-";
          document.getElementById("store-vis").textContent = store.isPublic ? "Public" : "Private";
        } else {
          document.getElementById("store-name").textContent = "Fledge Store";
          document.getElementById("store-desc").textContent = "Pass ?code=<emojicode> or ?storeId= to view a mini store.";
          document.getElementById("store-ref").textContent = storeId || "-";
          document.getElementById("store-vis").textContent = "-";
        }

        return storeId;
      } catch (err) {
        log(`Store meta load failed: ${err.message}`);
        return null;
      }
    };

    const loadStoreProducts = async (storeId) => {
      const grid = document.getElementById("store-products");
      if (!storeId) {
        renderEmpty(grid, "Provide ?code or ?storeId.");
        return;
      }
      try {
        const resp = await fetchJSON(`${ENDPOINTS.sanora}/products/base`);
        const products = normalizeProducts(resp).map((p) => ({
          ...p,
          storeId: p.storeId || storeId
        }));
        const filtered = products.filter((p) => {
          const vis = p.visibility || (p.isPublic ? "global" : "store");
          if (vis === "private") return false;
          return (p.storeId || "") === storeId || vis === "global";
        });
        renderProducts(grid, filtered, { showStoreMeta: true, storeRef: storeId });
        log(`Loaded ${filtered.length} products for store ${storeId}`);
      } catch (err) {
        renderEmpty(grid, "Could not load store products.");
        log(`Store products failed: ${err.message}`);
      }
    };

    const loadGlobal = async (filterStoreId = null) => {
      const grid = document.getElementById("global-products");
      try {
        const resp = await fetchJSON(`${ENDPOINTS.sanora}/products/base`);
        let filtered = normalizeProducts(resp).filter((p) => {
          const vis = p.visibility || (p.isPublic ? "global" : "store");
          return vis === "global";
        });
        if (filterStoreId) filtered = filtered.filter((p) => (p.storeId || "") === filterStoreId);
        renderProducts(grid, filtered, { showStoreMeta: true });
        log(`Loaded ${filtered.length} global products`);
      } catch (err) {
        renderEmpty(grid, "Could not load global products.");
        log(`Global load failed: ${err.message}`);
      }
    };

    document.getElementById("btn-refresh")?.addEventListener("click", async () => {
      await loadStoreProducts(currentStoreId);
      await loadGlobal(currentStoreId);
    });

    (async () => {
      currentStoreId = await loadStoreMeta();
      await loadStoreProducts(currentStoreId);
      await loadGlobal(currentStoreId);
      saveCart(loadCart());
    })();
  </script>
  <script src="nav.js"></script>
</body>
</html>
